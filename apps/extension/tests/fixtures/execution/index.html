<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field execution fixture</title>
  </head>
  <body>
    <label>Name <input id="name" value="" /></label>
    <output id="controlled-state"></output>
    <label>
      Country
      <select id="country">
        <option value="">Choose one</option>
        <option value="CA">Canada</option>
        <option value="CE">Canada East</option>
      </select>
    </label>
    <label>Start date <input id="date" type="date" /></label>
    <label>Cover note <span id="note" contenteditable="true"></span></label>
    <label>Location <input id="location" role="combobox" aria-controls="locations" aria-valuetext="" /></label>
    <div id="locations" role="listbox">
      <button role="option">Toronto</button>
      <button role="option">Toronto East</button>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
