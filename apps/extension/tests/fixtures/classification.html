<!doctype html>
<html>
  <body>
    <template data-case="unrelated"><main><h1>Weather dashboard</h1></main></template>
    <template data-case="job-listing">
      <main><h1>Senior Engineer</h1><p data-company>Example Corp</p><section id="job-description">Build reliable products.</section><a href="/apply">Apply now</a></main>
    </template>
    <template data-case="application">
      <main><h1>Apply for Senior Engineer</h1><form aria-label="Job application"><label>Email<input type="email"></label><label>Resume<input type="file"></label><button>Continue</button></form></main>
    </template>
    <template data-case="review"><main><h1>Review your application</h1><button>Submit application</button></main></template>
    <template data-case="confirmation"><main><h1>Application submitted</h1><p>Thank you for applying.</p></main></template>
    <template data-case="captcha"><main><h1>Verify you are human</h1><div class="g-recaptcha"></div></main></template>
    <template data-case="boundary"><main><h1>Coding assessment</h1><p>Complete this timed coding challenge.</p></main></template>
  </body>
</html>
